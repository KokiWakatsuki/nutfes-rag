name: Full Reindex

on:
  workflow_dispatch:

concurrency:
  group: drive-sync
  cancel-in-progress: false  # 実行中の方を優先し、後から来た方はキューで待機

jobs:
  reindex:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install system tools
        run: sudo apt-get install -y ghostscript libreoffice-writer libreoffice-calc libreoffice-impress

      - name: Truncate documents and full reindex
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        run: npm run reindex:ci
